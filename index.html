<!DOCTYPE html>
<!-- build 2026-08-12-1 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WuWa Rotation DPS</title>
<style>
  :root {
    --bg:#0e1013; --panel:#171a1f; --panel2:#1e222a; --line:#2a2f3a;
    --text:#e6e9ef; --dim:#8d95a5; --accent:#ffb347; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:16px; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; letter-spacing:.02em; }
  .sub { color:var(--dim); font-size:12px; }
  main { padding:24px; max-width:1180px; margin:0 auto; }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:20px; }
  select, button { font:inherit; background:var(--panel2); color:var(--text);
                   border:1px solid var(--line); border-radius:7px; padding:9px 13px; }
  select { min-width:340px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#1a1205; border-color:var(--accent); font-weight:650; }
  button.primary:hover { filter:brightness(1.08); }
  button.ghost:hover { border-color:var(--dim); }
  .total { background:var(--panel); border:1px solid var(--line); border-radius:12px;
           padding:20px 24px; margin-bottom:20px; display:flex; align-items:baseline;
           gap:18px; flex-wrap:wrap; }
  .total .n { font-size:40px; font-weight:700; letter-spacing:-.02em; color:var(--accent);
              font-variant-numeric:tabular-nums; }
  .total .lbl { color:var(--dim); }
  .delta { font-size:13px; color:var(--dim); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px;
           padding:0; margin-bottom:18px; overflow:hidden; }
  .panel > h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em;
                color:var(--dim); margin:0; padding:14px 18px; border-bottom:1px solid var(--line);
                display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .panel > h2 .hint { text-transform:none; letter-spacing:0; font-size:12px; }
  .body { padding:14px 18px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase;
       letter-spacing:.05em; }
  td.n, th.n { text-align:right; }
  tr:last-child td { border-bottom:none; }
  .who { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px;
         background:var(--panel2); color:var(--dim); border:1px solid var(--line); }
  .note { color:var(--dim); font-size:12px; }
  .badge { display:inline-flex; align-items:center; gap:6px; padding:4px 10px;
           border-radius:99px; font-size:12px; border:1px solid var(--line); background:var(--panel2); }
  .badge.ok { color:var(--good); border-color:#1e3a2a; }
  .badge.bad { color:var(--bad); border-color:#3a1e1e; }
  .badge.meh { color:var(--dim); }
  .badges { display:flex; gap:8px; flex-wrap:wrap; }
  .warn { color:var(--warn); }
  .warnbox { background:#2a220e; border:1px solid #4a3c14; color:#fde68a;
             border-radius:10px; padding:12px 16px; margin-bottom:18px; }
  .warnbox ul { margin:6px 0 0; padding-left:20px; }
  label.chk { display:flex; gap:9px; align-items:flex-start; padding:6px 0;
              border-bottom:1px solid var(--line); }
  label.chk:last-child { border-bottom:none; }
  label.chk input { margin-top:3px; }
  label.chk .nm { flex:1; }
  label.chk .own { color:var(--dim); font-size:11px; }
  label.chk .why { color:var(--dim); font-size:12px; display:block; margin-top:2px; }
  .cols { columns:2; column-gap:28px; }
  @media (max-width:820px){ .cols { columns:1; } select { min-width:100%; } }
  code { background:var(--panel2); padding:1px 5px; border-radius:4px; font-size:12px; }
  .err { background:#2a1212; border:1px solid #5a2020; color:#fca5a5;
         border-radius:10px; padding:16px 18px; }
  details > summary { cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>WuWa Rotation DPS</h1>
  <span class="sub">reads <code>data/characters.json</code> and <code>data/rotations.json</code> — edit those, reload, run</span>
  <span class="sub" style="margin-left:auto" id="build">build 2026-08-12-1</span>
</header>

<main>
  <div id="boot" class="panel"><div class="body">Loading…</div></div>

  <div id="app" hidden>
    <div class="bar">
      <select id="rot"></select>
      <button class="primary" id="run">Run</button>
      <button class="ghost" id="reset">Reset buffs</button>
      <span class="note" id="rotnote"></span>
    </div>

    <div id="warnings"></div>

    <div class="total">
      <div>
        <div class="lbl">Total damage, one rotation</div>
        <div class="n" id="total">—</div>
      </div>
      <div class="delta" id="delta"></div>
    </div>

    <div class="panel">
      <h2 data-toggle>Build check <span class="hint" id="panelsummary"></span></h2>
      <div class="body" id="panels"></div>
    </div>

    <div class="panel">
      <h2 data-toggle>Buffs in play <span class="hint">tick to A/B without editing files</span></h2>
      <div class="body cols" id="buffs"></div>
    </div>

    <div class="panel">
      <h2 data-toggle>Steps</h2>
      <div class="body" style="padding:0"><table id="steps"></table></div>
    </div>

    <div class="panel">
      <h2 data-toggle>Ability names <span class="hint">exact labels for writing rotations</span></h2>
      <div class="body" id="abilities"></div>
    </div>
  </div>
</main>

<script type="module">
import { Engine } from './engine.js';

const $ = (s) => document.querySelector(s);
const fmt = (n) => Math.round(n).toLocaleString('en-US');

let eng, lastTotal = null, overrides = new Map();   // buffId -> boolean

function boot(msg, isErr) {
  $('#boot').innerHTML = `<div class="body${isErr ? ' err' : ''}">${msg}</div>`;
  $('#boot').hidden = false;
}

try {
  eng = await Engine.load('./ref', './data');
} catch (e) {
  boot(`<strong>Could not load data.</strong><br>${e.message}
    <p class="note">If you opened this file directly from disk, the browser blocks the
    fetches. Serve the folder (<code>python3 -m http.server</code>) or use the GitHub Pages URL.</p>`, true);
  throw e;
}

$('#boot').hidden = true;
$('#app').hidden = false;

// ---- rotation picker
const sel = $('#rot');
for (const r of eng.rotations.rotations) {
  const o = document.createElement('option');
  o.value = r.id; o.textContent = r.name || r.id;
  sel.append(o);
}

sel.addEventListener('change', () => { overrides.clear(); lastTotal = null; render(); });
$('#run').addEventListener('click', render);
$('#reset').addEventListener('click', () => { overrides.clear(); render(); });
document.addEventListener('click', (e) => {
  const h = e.target.closest('h2[data-toggle]');
  if (!h) return;
  const b = h.nextElementSibling;
  b.hidden = !b.hidden;
});

function activeBuffIds(rot) {
  const ids = new Set(rot.buffs || []);
  for (const [id, on] of overrides) on ? ids.add(id) : ids.delete(id);
  return [...ids];
}

function render() {
  const rot = eng.rotation(sel.value);
  const patched = { ...rot, buffs: activeBuffIds(rot) };
  // run against a temporary rotation carrying the toggled buff set
  const saved = eng.rotations.rotations;
  eng.rotations = { ...eng.rotations, rotations: saved.map(r => r.id === rot.id ? patched : r) };
  const res = eng.runRotation(rot.id);
  eng.rotations = { ...eng.rotations, rotations: saved };

  $('#rotnote').textContent = rot.notes || '';

  // total + delta vs the previous run
  $('#total').textContent = fmt(res.total);
  if (lastTotal != null && Math.abs(res.total - lastTotal) > 0.5) {
    const d = res.total - lastTotal;
    const pct = (d / lastTotal * 100);
    $('#delta').innerHTML = `<span style="color:${d > 0 ? 'var(--good)' : 'var(--bad)'}">
      ${d > 0 ? '+' : ''}${fmt(d)} (${pct > 0 ? '+' : ''}${pct.toFixed(1)}%)</span>
      <span class="note">vs previous run</span>`;
  } else if (lastTotal == null) {
    $('#delta').innerHTML = `<span class="note">run again after changing something to see the delta</span>`;
  }
  lastTotal = res.total;

  // warnings
  $('#warnings').innerHTML = res.warnings.length
    ? `<div class="warnbox"><strong>${res.warnings.length} warning${res.warnings.length > 1 ? 's' : ''}</strong>
       <ul>${res.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>`
    : '';

  // build check
  const pboxes = [];
  let okCount = 0, checked = 0;
  for (const cid of rot.team) {
    const pc = res.panels[cid];
    if (!pc) { pboxes.push(`<span class="badge meh">${cid}: no panel recorded</span>`); continue; }
    if (!pc.accountAccurate) {
      pboxes.push(`<span class="badge meh" title="weapon level / ascension not solved yet">${cid}: unreconciled</span>`);
      continue;
    }
    checked++;
    if (pc.allOk) { okCount++; pboxes.push(`<span class="badge ok">${cid}: matches your panel</span>`); }
    else {
      const bad = pc.rows.filter(r => !r.ok)
        .map(r => `${r.stat} ${r.computed.toFixed(1)} vs ${r.panel}`).join(', ');
      pboxes.push(`<span class="badge bad" title="${esc(bad)}">${cid}: ${esc(bad)}</span>`);
    }
  }
  $('#panels').innerHTML = `<div class="badges">${pboxes.join('')}</div>
    <p class="note" style="margin-bottom:0">Green means the engine reproduces your in-game character
    panel exactly from the data in <code>characters.json</code>. Grey means that character's real
    weapon level and ascension have not been solved yet, so their stats run at the reference
    defaults — fine for relative comparisons, not for matching the game.</p>`;
  $('#panelsummary').textContent = checked ? `${okCount}/${checked} verified` : '';

  // buffs
  const index = eng.allBuffs();
  const on = new Set(patched.buffs);
  const owners = [...new Set([...index.values()].map(b => b.owner))]
    .filter(o => rot.team.includes(o));
  $('#buffs').innerHTML = owners.map(o => {
    const rows = [...index.values()].filter(b => b.owner === o).map(b => `
      <label class="chk">
        <input type="checkbox" data-buff="${esc(b.id)}" ${on.has(b.id) ? 'checked' : ''}>
        <span class="nm">${esc(b.name || b.id)}
          ${b.notes ? `<span class="why">${esc(b.notes)}</span>` : ''}</span>
      </label>`).join('');
    return `<div style="break-inside:avoid; margin-bottom:16px">
      <div class="own" style="color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-size:11px;margin-bottom:4px">${esc(o)}</div>
      ${rows}</div>`;
  }).join('');
  for (const cb of document.querySelectorAll('#buffs input[data-buff]')) {
    cb.addEventListener('change', () => { overrides.set(cb.dataset.buff, cb.checked); render(); });
  }

  // steps
  $('#steps').innerHTML = `
    <thead><tr><th>#</th><th>Who</th><th>Ability</th><th class="n">×</th>
      <th class="n">Each</th><th class="n">Damage</th><th>Note</th></tr></thead>
    <tbody>${res.steps.map((s, i) => `
      <tr>
        <td class="note">${i + 1}</td>
        <td><span class="who">${esc(s.char || '—')}</span></td>
        <td>${esc(s.ability || 'fixed amount')}</td>
        <td class="n">${s.count}</td>
        <td class="n">${fmt(s.each)}</td>
        <td class="n"><strong>${fmt(s.total)}</strong></td>
        <td class="note">${esc(s.note || '')}</td>
      </tr>`).join('')}</tbody>`;

  // ability reference
  $('#abilities').innerHTML = rot.team.map(cid => {
    let names;
    try { names = [...eng.abilities(cid).keys()]; } catch { return ''; }
    return `<details><summary><strong>${esc(cid)}</strong>
      <span class="note">— ${names.length} abilities</span></summary>
      <div class="note" style="margin-top:8px">
        ${names.map(n => `<code>${esc(n)}</code>`).join(' ')}
      </div></details>`;
  }).join('');
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

render();
</script>
</body>
</html>
