<!DOCTYPE html>
<!-- build 2026-08-13-1 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WuWa Rotations + DPS</title>
<style>
:root{--bg:#0d1017;--panel:#151a24;--panel2:#1b212d;--line:#262e3d;
--txt:#dfe5ef;--dim:#8a94a6;--gold:#e8c15f;--grn:#5fd98a;--red:#e05a5a;--blu:#5aa8e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px 20px 80px}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:24px;margin:0 0 3px}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:13px}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:9px 16px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;font-family:inherit}
.tab:hover{border-color:#3a465c;color:var(--txt)}
.tab.on{background:var(--gold);border-color:var(--gold);color:#151a24}
.rhead{margin-bottom:14px}
.rhead h2{margin:0 0 2px;font-size:20px}
.rhead .meta{color:var(--dim);font-size:13px}
.rhead .order{margin-top:6px;font-size:12.5px;color:var(--gold)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 16px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:11.5px;color:var(--dim)}
.chip b{color:var(--txt);font-weight:600}
.chip i{color:var(--gold);font-style:normal}
.simbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
button.sim{background:var(--gold);border:1px solid var(--gold);color:#151a24;padding:10px 20px;border-radius:9px;cursor:pointer;font:inherit;font-weight:700;font-size:14px}
button.sim:hover{filter:brightness(1.08)}
button.gh{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:10px 16px;border-radius:9px;cursor:pointer;font:inherit;font-size:13px}
button.gh:hover{color:var(--txt);border-color:#3a465c}
.totals{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:18px}
.totals .big{font-size:34px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.totals .row{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline}
.totals .lbl{color:var(--dim);font-size:12px}
.strip{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:18px}
.grp{display:flex;flex-direction:column;gap:6px}
.grp h4{margin:0;font-size:10px;text-transform:uppercase;letter-spacing:1.1px;color:var(--gold);font-weight:700}
.grp .gs{color:var(--dim);font-size:10.5px;font-weight:400;text-transform:none;letter-spacing:0;margin-left:7px}
.grp.nocount h4{color:var(--dim)}
.grp.nocount .grow{opacity:.62}
.grow{display:flex;gap:6px;flex-wrap:wrap}
.st{position:relative;width:74px;text-align:center;cursor:pointer;padding:5px 3px 4px;border-radius:10px;border:1px solid transparent;transition:.12s}
.st:hover{background:var(--panel)}
.st.sel{background:#1d2333;border-color:#4a5c94}
.st.opt{opacity:.55}
.st img.ic,.st .fb{width:58px;height:58px;border-radius:10px;margin:0 auto;display:block;background:#1f242e;border:1px solid #333c4d;object-fit:contain}
.st .fb{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#aab4c4;border-width:2px;border-color:#4a5568}
.st.key img.ic,.st.key .fb{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,193,95,.28)}
.st .n{position:absolute;top:24px;left:1px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:9.5px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2}
.st .x{position:absolute;top:24px;right:1px;background:var(--gold);color:#151a24;font-size:9.5px;font-weight:800;border-radius:20px;padding:1px 6px;z-index:2}
.st .lb{font-size:10.5px;color:var(--dim);margin-top:4px;line-height:1.2}
.dmg{height:22px;margin-bottom:2px;font-variant-numeric:tabular-nums;font-size:9.5px;line-height:1.05;letter-spacing:-.2px}
.dmg .a{display:block;color:var(--gold);font-weight:700;font-size:11.5px}
.dmg .mm{display:block;color:var(--dim)}
.dmg.none{color:#39415280}
.detail{background:var(--panel2);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:13px 16px;margin-bottom:22px;min-height:78px}
.detail .who{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);font-weight:700}
.detail h3{margin:2px 0 5px;font-size:16px}
.detail .info{color:var(--dim);font-size:13.5px}
.detail .hits{margin-top:8px;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.detail .hits code{background:var(--panel);padding:1px 6px;border-radius:4px;margin-right:4px;display:inline-block;margin-bottom:3px}
.notes{margin-top:8px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 17px;margin-bottom:10px}
.note h3{margin:0 0 5px;font-size:14.5px;color:var(--gold)}
.note div{color:var(--dim);font-size:13.5px}
.warnbox{background:#2a220e;border:1px solid #4a3c14;color:#fde68a;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px}
.warnbox ul{margin:6px 0 0;padding-left:20px}
.err{background:#2a1212;border:1px solid #5a2020;color:#fca5a5;border-radius:10px;padding:16px 18px}
.badge{display:inline-flex;padding:3px 10px;border-radius:99px;font-size:11.5px;border:1px solid var(--line);background:var(--panel2);margin-right:6px}
.badge.ok{color:var(--grn);border-color:#1e3a2a}
.badge.bad{color:var(--red);border-color:#3a1e1e}
.badge.meh{color:var(--dim)}
.foot{color:var(--dim);font-size:11.5px;margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>WuWa Rotations</h1>
  <div class="sub">Hover any step for its notes, click to pin. Press <b>Simulate DPS</b> to put damage on every icon.
    <span style="float:right">build 2026-08-13-1</span></div>
  <div id="boot"></div>
  <div id="app" hidden>
    <div class="tabs" id="tabs"></div>
    <div class="rhead" id="rhead"></div>
    <div class="chips" id="chips"></div>
    <div class="simbar">
      <button class="sim" id="run">Simulate DPS</button>
      <button class="gh" id="clear" hidden>Hide numbers</button>
      <span class="sub" style="margin:0" id="simhint">nothing computed yet</span>
    </div>
    <div id="totals"></div>
    <div id="warn"></div>
    <div class="strip" id="strip"></div>
    <div class="detail" id="detail"></div>
    <div class="notes" id="notes"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script type="module">
import { Engine } from './engine.js';

const $ = (s) => document.querySelector(s);
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let eng, current, results = null, pinned = null;

try {
  eng = await Engine.load('./ref', './data');
} catch (e) {
  $('#boot').innerHTML = `<div class="err"><b>Could not load data.</b><br>${esc(e.message)}
    <p class="sub">Opened straight from disk? The browser blocks the fetches. Serve the folder
    (<code>python3 -m http.server</code>) or use the GitHub Pages URL.</p></div>`;
  throw e;
}
$('#app').hidden = false;

const rots = [...eng.rotations.rotations].sort((a, b) => (a.sort ?? 99) - (b.sort ?? 99));
current = rots[0].id;

$('#tabs').innerHTML = rots.map(r =>
  `<button class="tab" data-id="${esc(r.id)}">${esc(r.name)}</button>`).join('');
$('#tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  current = t.dataset.id; results = null; pinned = null; render();
});
$('#run').addEventListener('click', simulate);
$('#clear').addEventListener('click', () => { results = null; render(); });

function iconLetter(name) {
  if (/_Switch$/.test(name)) return '&#8646;';
  if (/_echo$/i.test(name)) return 'E';
  const m = /_([A-Z])$/.exec(name);
  return m ? m[1] : '?';
}

function simulate() {
  $('#run').textContent = 'Simulating…';
  setTimeout(() => {
    results = { res: eng.runRotation(current), sim: eng.simulateRotation(current, 20000) };
    $('#run').textContent = 'Simulate DPS';
    render();
  }, 10);
}

function render() {
  const rot = eng.rotation(current);
  for (const t of document.querySelectorAll('.tab')) t.classList.toggle('on', t.dataset.id === current);

  $('#rhead').innerHTML = `<h2>${esc(rot.name)}</h2>
    <div class="meta">${esc(rot.sub || '')}</div>
    ${rot.order ? `<div class="order">${esc(rot.order)}</div>` : ''}`;

  $('#chips').innerHTML = (rot.timeline || []).map(b =>
    `<span class="chip"><b>${esc(b.name)}</b> &middot; <i>${esc(b.dur)}</i> &middot; ${esc(b.src)}</span>`).join('');

  if (results) {
    const { res, sim } = results;
    $('#totals').innerHTML = `<div class="totals"><div class="row">
      <div><div class="lbl">Total damage, one rotation</div><div class="big">${fmt(res.total)}</div></div>
      <div><div class="lbl">80% of runs land between</div>
        <div style="font-size:18px;font-variant-numeric:tabular-nums">${fmt(sim.p10)} &ndash; ${fmt(sim.p90)}</div></div>
      <div><div class="lbl">median run</div>
        <div style="font-size:18px;font-variant-numeric:tabular-nums">${fmt(sim.p50)}</div></div>
      <div><div class="lbl">worst / best seen</div>
        <div style="font-size:18px;font-variant-numeric:tabular-nums">${fmt(sim.min)} / ${fmt(sim.max)}</div></div>
    </div>
    <div class="lbl" style="margin-top:9px">${sim.instances} independent crit rolls per run &middot;
      ${fmt(sim.fixed)} (${(sim.fixed / sim.expected * 100).toFixed(0)}%) cannot crit &middot;
      swing ${(sim.cv * 100).toFixed(1)}% of the mean</div></div>`;
    $('#clear').hidden = false;
    $('#simhint').textContent = 'non-crit · average · crit, per step';
    const badges = rot.team.map(cid => {
      const pc = res.panels[cid];
      if (!pc) return `<span class="badge meh">${esc(cid)}: no panel recorded</span>`;
      if (!pc.accountAccurate) return `<span class="badge meh">${esc(cid)}: build unverified</span>`;
      return pc.allOk ? `<span class="badge ok">${esc(cid)}: matches your panel</span>`
                      : `<span class="badge bad">${esc(cid)}: does not match panel</span>`;
    }).join('');
    $('#warn').innerHTML =
      (res.warnings.length ? `<div class="warnbox"><b>${res.warnings.length} warning${res.warnings.length > 1 ? 's' : ''}</b>
        <ul>${res.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : '')
      + `<div style="margin-bottom:14px">${badges}</div>`;
  } else {
    $('#totals').innerHTML = '';
    $('#warn').innerHTML = '';
    $('#clear').hidden = true;
    $('#simhint').textContent = 'nothing computed yet';
  }

  const byKey = new Map();
  if (results) for (const s of results.res.steps) byKey.set(`${s._group}:${s._idx}`, s);

  let n = 0;
  $('#strip').innerHTML = rot.groups.map((g, gi) => `
    <div class="grp${g.count === false ? ' nocount' : ''}">
      <h4>${esc(g.title)}${g.sub ? `<span class="gs">${esc(g.sub)}</span>` : ''}</h4>
      <div class="grow">${g.steps.map((st, si) => {
        n++;
        const flags = st.flags || [];
        const xN = flags.find(f => /^x\d+$/.test(f));
        const d = byKey.get(`${gi}:${si}`);
        const dmg = !results ? ''
          : (d && d.average > 0
              ? `<div class="dmg"><span class="a">${fmt(d.average)}</span><span class="mm">${fmt(d.noncrit)} &middot; ${fmt(d.crit)}</span></div>`
              : `<div class="dmg none">&mdash;</div>`);
        return `<div class="st${flags.includes('key') ? ' key' : ''}${flags.includes('opt') ? ' opt' : ''}" data-g="${gi}" data-s="${si}">
          ${dmg}<span class="n">${n}</span>${xN ? `<span class="x">${esc(xN)}</span>` : ''}
          <img class="ic" src="icons/${encodeURIComponent(st.icon)}.png" alt="" data-l="${iconLetter(st.icon)}">
          <div class="lb">${esc(st.action)}</div>
        </div>`;
      }).join('')}</div>
    </div>`).join('');

  for (const img of document.querySelectorAll('#strip img.ic')) {
    img.addEventListener('error', () => {
      const d = document.createElement('div');
      d.className = 'fb'; d.innerHTML = img.dataset.l;
      img.replaceWith(d);
    }, { once: true });
  }

  $('#notes').innerHTML = (rot.notes || []).map(nt =>
    `<div class="note"><h3>${esc(nt.t)}</h3><div>${nt.b}</div></div>`).join('');

  $('#foot').innerHTML = `Enemy level ${rot.enemy?.level ?? 100} at ${rot.enemy?.res ?? 20}% resistance &middot;
    ${rot.groups.reduce((a, g) => a + g.steps.length, 0)} steps &middot;
    builds from <code>data/characters.json</code>, rotation from <code>data/rotations.json</code>`;

  showDetail(pinned);
}

function showDetail(key) {
  const rot = eng.rotation(current);
  for (const el of document.querySelectorAll('.st')) el.classList.remove('sel');
  if (!key) {
    $('#detail').innerHTML = `<div class="info">Hover a step to read its notes. Click to pin one.</div>`;
    return;
  }
  const [gi, si] = key.split(':').map(Number);
  const st = rot.groups[gi]?.steps[si];
  if (!st) return;
  const el = document.querySelector(`.st[data-g="${gi}"][data-s="${si}"]`);
  if (el) el.classList.add('sel');
  const d = results ? results.res.steps.find(x => x._group === gi && x._idx === si) : null;
  const hits = (st.hits || []).map(h => typeof h === 'string' ? h : `${h.ability} ×${h.times}`);
  $('#detail').innerHTML = `
    <div class="who">${esc(st.char || '—')}</div>
    <h3>${esc(st.action)}</h3>
    <div class="info">${st.note || '<span style="opacity:.6">No notes on this step.</span>'}</div>
    ${d && d.average > 0 ? `<div class="hits"><b style="color:var(--gold)">${fmt(d.average)}</b> average
        &middot; ${fmt(d.noncrit)} if nothing crits &middot; ${fmt(d.crit)} if everything does
        ${d.counts === false ? ' &middot; <i>shown for reference, not counted in the total</i>' : ''}</div>` : ''}
    ${hits.length ? `<div class="hits">fires: ${hits.map(h => `<code>${esc(h)}</code>`).join('')}</div>` : ''}`;
}

document.addEventListener('mouseover', e => {
  const t = e.target.closest('.st'); if (!t || pinned) return;
  showDetail(`${t.dataset.g}:${t.dataset.s}`);
});
document.addEventListener('click', e => {
  const t = e.target.closest('.st'); if (!t) return;
  const key = `${t.dataset.g}:${t.dataset.s}`;
  pinned = pinned === key ? null : key;
  showDetail(pinned);
});

render();
</script>
</body>
</html>
